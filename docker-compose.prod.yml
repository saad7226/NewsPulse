# NewsPulse — Production Docker Compose
# Target: DigitalOcean 8GB RAM / 2 vCPU Droplet ($48/mo)
# Images pulled from GHCR — NO local building on server
#
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Requires: .env.production file with all secrets filled in

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: newspulse_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - news-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 300M

  # ─── Auth Service ──────────────────────────────────────────────────────────
  auth_service:
    image: ghcr.io/${GITHUB_USERNAME}/newspulse-auth:latest
    container_name: newspulse-auth-service
    restart: always
    volumes:
      - ./auth_data:/app/data   # persist SQLite user database
    networks:
      - news-network
    env_file: .env.production
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M

  # ─── Article Fetcher ───────────────────────────────────────────────────────
  article_fetcher:
    image: ghcr.io/${GITHUB_USERNAME}/newspulse-fetcher:latest
    container_name: newspulse-article-fetcher-1
    # NO ports: internal only — gateway proxies all requests
    env_file: .env.production
    networks:
      - news-network
    depends_on:
      - redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  # ─── Summarizer (Groq API — no model in RAM) ───────────────────────────────
  summarizer:
    image: ghcr.io/${GITHUB_USERNAME}/newspulse-summarizer:latest
    container_name: newspulse-summarizer-1
    # NO ports: internal only
    env_file: .env.production
    networks:
      - news-network
    depends_on:
      - redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M   # Lean — no PyTorch, no model in RAM

  # ─── Counter Argument (Groq API — no model in RAM) ─────────────────────────
  counter_argument:
    image: ghcr.io/${GITHUB_USERNAME}/newspulse-counter:latest
    container_name: newspulse-counter-argument-1
    # NO ports: internal only
    env_file: .env.production
    networks:
      - news-network
    depends_on:
      - redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 300M   # Very lean — no PyTorch, no model in RAM

  # ─── Political Bias (baked valurank/distilroberta-bias) ─────────────────────
  political_bias:
    image: ghcr.io/${GITHUB_USERNAME}/newspulse-political-bias:latest
    container_name: newspulse-political-bias-1
    # NO ports: internal only
    env_file: .env.production
    networks:
      - news-network
    depends_on:
      - redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1500M
        reservations:
          memory: 400M

  # ─── Fake News Detection (baked dhruvpal/fake-news-bert) ───────────────────
  fakenews_detection:
    image: ghcr.io/${GITHUB_USERNAME}/newspulse-fakenews:latest
    container_name: newspulse-fakenews-detection-1
    # NO ports: internal only
    env_file: .env.production
    networks:
      - news-network
    depends_on:
      - redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1500M
        reservations:
          memory: 400M

  # ─── Article Writer (Groq API — user article creation platform) ─────────────
  article_writer:
    image: ghcr.io/${GITHUB_USERNAME}/newspulse-article-writer:latest
    container_name: newspulse-article-writer
    env_file: .env.production
    networks:
      - news-network
    restart: always
    volumes:
      - article_writer_data:/app   # persist SQLite article database
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 300M

  # ─── API Gateway (ONLY public API port) ────────────────────────────────────
  gateway:
    image: ghcr.io/${GITHUB_USERNAME}/newspulse-gateway:latest
    container_name: newspulse-gateway
    ports:
      - '8000:8000'   # ← Only public API port
    env_file: .env.production
    networks:
      - news-network
    depends_on:
      - summarizer
      - counter_argument
      - political_bias
      - fakenews_detection
      - article_writer
      - redis
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M

  # ─── Frontend (ONLY public frontend port) ──────────────────────────────────
  frontend:
    image: ghcr.io/${GITHUB_USERNAME}/newspulse-frontend:latest
    container_name: newspulse-frontend
    ports:
      - '3000:80'     # ← Only public frontend port
    networks:
      - news-network
    depends_on:
      - gateway
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 200M

  # ─── Monitoring ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: newspulse-prometheus
    # NO public port — access via SSH tunnel if needed
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - news-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M

  grafana:
    image: grafana/grafana:latest
    container_name: newspulse-grafana
    ports:
      - '3001:3000'   # Grafana dashboard (separate port)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - news-network
    depends_on:
      - prometheus
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M

# ─── Volumes (only infrastructure — NO ML model volumes, models baked in images)
volumes:
  redis_data: {}
  prometheus_data: {}
  grafana_data: {}
  article_writer_data: {}

# ─── Network ──────────────────────────────────────────────────────────────────
networks:
  news-network:
    driver: bridge
