
services:
  redis:
    image: redis:7.4-alpine
    container_name: newspulse_redis
    restart: always
    volumes:
    - redis_data:/data
    networks:
    - news-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          memory: 512M

  auth_service:
    build: ./auth_service
    container_name: newspulse-auth-service
    restart: always
    volumes:
    - ./auth_data:/app/data
    networks:
    - news-network
    env_file:
    - .env
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
  summarizer:
    build: ./article_summarizer
    container_name: newspulse-summarizer-1
    ports:
    - '8001:8000'
    env_file:
    - .env
    environment:
      HF_SUMMARIZER_MODEL: sshleifer/distilbart-cnn-12-6
      HF_LOCAL_DIR: /models/summarizer_model
    volumes:
    - summarizer_model:/models/summarizer_model
    networks:
    - news-network
    depends_on:
    - redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          memory: 4G
  article_fetcher:
    build: ./article_fetcher
    container_name: newspulse-article-fetcher-1
    ports:
    - '8004:8000'
    env_file:
    - .env
    networks:
    - news-network
    depends_on:
    - redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          memory: 512M
  counter_argument:
    build: ./counter_argument
    container_name: newspulse-counter-argument-1
    ports:
    - '8002:8000'
    env_file:
    - .env
    environment:
      HF_PRIMARY_MODEL: MBZUAI/LaMini-Flan-T5-248M
      HF_FALLBACK_MODEL: google/flan-t5-base
      HF_LOCAL_DIR: /models/counter_model
    volumes:
    - counter_model:/models/counter_model
    networks:
    - news-network
    depends_on:
    - redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 1G
  political_bias:
    build: ./political_bias
    container_name: newspulse-political-bias-1
    ports:
    - '8003:8000'
    env_file:
    - .env
    environment:
      HF_LOCAL_DIR: /models/political_bias_model
      # valurank/distilroberta-bias: Lightweight PyTorch native bias model
      HF_MODEL_NAME: valurank/distilroberta-bias
    volumes:
    - political_bias_model:/models/political_bias_model
    networks:
    - news-network
    depends_on:
    - redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G
        reservations:
          memory: 2G
  fakenews_detection:
    build: ./fakenews_detection
    container_name: newspulse-fakenews-detection-1
    ports:
    - '8005:8000'
    env_file:
    - .env
    environment:
      HF_LOCAL_DIR: /models/fake_news_models
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_OFFLINE: '1'
    volumes:
    - fake_news_models:/models/fake_news_models
    networks:
    - news-network
    depends_on:
    - redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G
        reservations:
          memory: 2G
  evaluation_engine:
    build: ./evaluation_engine
    container_name: newspulse-eval-engine
    profiles: ["eval"]
    depends_on:
      - summarizer
      - fakenews_detection
      - political_bias
      - counter_argument
      - gateway
    networks:
      - news-network
    volumes:
      - ./report:/app/report
      - ./evaluation_engine/tests:/app/tests
  gateway:
    build: ./gateway
    container_name: newspulse-gateway
    ports:
    - '8000:8000'
    env_file:
    - .env
    networks:
    - news-network
    depends_on:
    - summarizer
    - counter_argument
    - political_bias
    - fakenews_detection
    - redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test:
      - CMD
      - curl
      - "-f"
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 5
  frontend:
    build: ./frontend
    container_name: newspulse-frontend
    ports:
    - '3000:80'
    networks:
    - news-network
    depends_on:
    - gateway
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
  prometheus:
    image: prom/prometheus:latest
    container_name: newspulse-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - news-network
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: newspulse-grafana
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    networks:
      - news-network
    depends_on:
      - prometheus
    restart: always

volumes:
  prometheus_data: {}
  grafana_data: {}
  redis_data: {}
  political_bias_model:
    external: true
    name: newspulse_political_bias_model
  fake_news_models:
    external: true
    name: newspulse_fake_news_models
  summarizer_model:
    external: true
    name: newspulse_summarizer_model
  counter_model:
    external: true
    name: newspulse_counter_model
networks:
  news-network:
    driver: bridge
