<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BE123C" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Smooth Rounded Background Square -->
  <rect x="0" y="0" width="128" height="128" rx="36" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="3"/>

  <!-- Newspaper / AI Microchip Background Subtly Integrated -->
  <path d="M34 38 h60 a4 4 0 0 1 4 4 v48 a4 4 0 0 1 -4 4 h-60 a4 4 0 0 1 -4 -4 v-48 a4 4 0 0 1 4 -4 z" 
        fill="none" stroke="#334155" stroke-dasharray="4 3" stroke-width="2" opacity="0.4"/>

  <!-- Glowing Heartbeat Pulse / News Wave Line -->
  <path d="M 22 64 
           H 44 
           L 54 28 
           L 66 100 
           L 76 46 
           L 84 76 
           L 92 64 
           H 106" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Glowing Energy Node/Dot at the Peak -->
  <circle cx="54" cy="28" r="4.5" fill="#FFF" filter="url(#glow)"/>
</svg>
